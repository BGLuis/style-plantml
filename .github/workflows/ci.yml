name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Render and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout code
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify PlantUML
        run: make download-plantuml

      - name: Build all diagrams
        run: make all

      - name: Check for duplicate images
        run: make check-dupes

      - name: Run verification tests
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: make test
